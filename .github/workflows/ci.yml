# CI: build and run the complete unit-test suite.
name: CI

on:
  push:
    branches: [master, main, fanmode]
  pull_request:
    branches: [master, main, fanmode]

jobs:
  build-linux:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt5-qmake qtbase5-dev libqt5svg5-dev qttools5-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev \
            libqpdf-dev poppler-utils tesseract-ocr tesseract-ocr-ara

      - name: Configure and build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure
